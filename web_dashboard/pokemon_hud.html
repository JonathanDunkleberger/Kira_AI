<!DOCTYPE html>
<!-- Kira's Pokémon STREAM HUD (OBS browser source) — SIDEBAR RAIL (2026-08-02).
     ~98px wide (half of the prior slim column). Quiet ink+brass strip, less chrome,
     more glass — sits beside the game instead of covering it. Same /pokemon_hud.json. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kira · Pokémon HUD</title>
<style>
  :root{
    --ink:#0a090b;
    --card:rgba(10,9,11,.72);
    --card2:rgba(255,255,255,.04);
    --hairline:rgba(212,190,160,.14);
    --hairline-soft:rgba(212,190,160,.08);
    --brass:#d4bea0; --brass-bg:rgba(212,190,160,.12); --brass-dim:rgba(212,190,160,.42);
    --cream:#efe7ee; --muted:rgba(222,212,224,.55); --subtle:rgba(222,212,224,.32);
    --rose:#cf8fa6; --sage:#8fbf8f; --amber:#d9b56a;
    --hp-hi:#8fbf8f; --hp-mid:#d9b56a; --hp-lo:#cf7a6a;
    --rail:98px;
  }
  html,body{margin:0;background:transparent;overflow:hidden;
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
    -webkit-font-smoothing:antialiased;}
  #hud{position:fixed;left:14px;bottom:14px;width:var(--rail);opacity:0;
    transition:opacity .7s ease;color:var(--cream);
    text-shadow:0 1px 2px rgba(0,0,0,.55);}
  #hud.on{opacity:1;}

  .shell{background:var(--card);border:1px solid var(--hairline);border-radius:11px;
    backdrop-filter:blur(14px) saturate(1.05);
    box-shadow:0 4px 18px rgba(0,0,0,.28);overflow:hidden;}

  /* ── mast: monogram + state pip ── */
  .mast{padding:8px 8px 7px;border-bottom:1px solid var(--hairline-soft);}
  .row1{display:flex;align-items:center;justify-content:space-between;gap:4px;}
  .brand{font-weight:400;letter-spacing:.22em;font-size:10px;text-transform:uppercase;
    color:var(--cream);line-height:1;padding-left:1px;}
  .pip{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none;
    box-shadow:0 0 6px rgba(212,190,160,.4);}
  .pip.battle{background:var(--rose);box-shadow:0 0 6px rgba(207,143,166,.45);}
  .pip.healing{background:var(--sage);box-shadow:0 0 6px rgba(143,191,143,.4);}
  .pip.shopping{background:var(--amber);box-shadow:0 0 6px rgba(217,181,106,.4);}

  .place{margin-top:6px;font-family:'Segoe UI',system-ui,sans-serif;font-size:9.5px;
    font-weight:600;color:var(--cream);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;line-height:1.2;}
  #timer{display:block;margin-top:2px;font-family:'Segoe UI',system-ui,sans-serif;
    font-size:8.5px;font-variant-numeric:tabular-nums;color:var(--subtle);letter-spacing:.02em;}

  .obj{margin-top:6px;font-family:'Segoe UI',system-ui,sans-serif;font-size:9px;
    color:var(--brass);line-height:1.25;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .want{display:none;} /* sidebar: want folds into obj title via JS if needed */

  .goals{margin-top:6px;padding-top:6px;border-top:1px solid var(--hairline-soft);
    font-family:'Segoe UI',system-ui,sans-serif;}
  .goal{display:none;}
  .goal.now{display:block;}
  .goal .lbl{font-size:7px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brass);line-height:1;}
  .goal .txt{font-size:9px;color:var(--cream);line-height:1.2;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}

  /* ── badges: 4×2 grid ── */
  .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 3px;
    padding:7px 8px 4px;border-bottom:1px solid var(--hairline-soft);}
  .badge{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;}
  .badge svg{width:13px;height:13px;filter:grayscale(1) brightness(.38) opacity(.4);
    transition:filter .5s ease;}
  .badge.lit svg{filter:none;}
  .bcount{grid-column:1/-1;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;
    font-size:9px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;
    padding-bottom:2px;letter-spacing:.04em;}
  .bcount span{color:var(--subtle);font-weight:400;}

  /* ── party: sprite-led stack ── */
  .party{padding:6px 6px 7px;}
  .ttl{font-family:'Segoe UI',system-ui,sans-serif;font-size:7px;letter-spacing:.18em;
    color:var(--subtle);text-transform:uppercase;margin:0 1px 5px;font-weight:600;
    text-align:center;}
  .mon{position:relative;padding:5px 5px 6px;border-radius:8px;background:var(--card2);
    border:1px solid var(--hairline-soft);margin-bottom:4px;overflow:hidden;
    text-align:center;}
  .mon:last-child{margin-bottom:0;}
  .mon .rail{position:absolute;left:0;top:0;bottom:0;width:2px;opacity:.85;}
  .mon .sprite{width:28px;height:28px;image-rendering:pixelated;image-rendering:crisp-edges;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));display:block;margin:0 auto;}
  .mon .ph{width:28px;height:28px;margin:0 auto;display:flex;align-items:center;
    justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;
    font-weight:700;color:var(--ink);border-radius:6px;}
  .mon .nm{font-family:'Segoe UI',system-ui,sans-serif;font-weight:650;font-size:9px;
    color:var(--cream);text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;margin-top:3px;line-height:1.15;padding:0 1px;}
  .mon .meta{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px;}
  .mon .lv{font-family:'Segoe UI',system-ui,sans-serif;font-size:8px;font-weight:600;
    color:var(--brass);font-variant-numeric:tabular-nums;}
  .onfield{font-family:'Segoe UI',system-ui,sans-serif;font-size:6px;font-weight:800;
    letter-spacing:.08em;color:#0d0c0e;background:var(--brass);border-radius:2px;
    padding:1px 3px;text-transform:uppercase;}
  .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;
    margin-top:4px;}
  .fill{height:100%;border-radius:2px;transition:width .5s ease,background .5s ease;}
  .mon.fainted{opacity:.34;}
  .mon.fainted .fill{width:0!important;}
  .mon.active{border-color:rgba(212,190,160,.5);
    box-shadow:inset 0 0 0 1px rgba(212,190,160,.14);
    background:rgba(212,190,160,.07);}
  .mon.active .sprite{width:32px;height:32px;}
  .empty{font-size:9px;font-style:italic;color:var(--muted);padding:4px 2px;text-align:center;}

  /* hide unused timeline tiers in DOM without JS fighting display */
  .goal.med,.goal.long{display:none!important;}
</style>
</head>
<body>
<div id="hud">
  <div class="shell">
    <div class="mast">
      <div class="row1"><span class="brand">Kira</span><span class="pip" id="state" title="Exploring"></span></div>
      <div class="place" id="place">—</div>
      <span id="timer"></span>
      <div class="obj" id="obj"></div>
      <div class="want" id="want"></div>
      <div class="goals" id="goals">
        <div class="goal now"><div class="lbl">Now</div><div class="txt" id="gShort"></div></div>
        <div class="goal med"><div class="lbl">Next</div><div class="txt" id="gMed"></div></div>
        <div class="goal long"><div class="lbl">Goal</div><div class="txt" id="gLong"></div></div>
      </div>
    </div>
    <div class="badges" id="badges"></div>
    <div class="party"><div class="ttl">team</div><div id="party"></div></div>
  </div>
</div>
<script>
const BADGES = ["Boulder","Cascade","Thunder","Rainbow","Soul","Marsh","Volcano","Earth"];
const BADGE_SVG = {
  Boulder:`<polygon points="12,2 20,7 20,17 12,22 4,17 4,7" fill="#9b9486" stroke="#cfc7b6" stroke-width="1.2"/>`,
  Cascade:`<path d="M12 2 C12 2 4 12 4 16 a8 8 0 0 0 16 0 C20 12 12 2 12 2Z" fill="#4fa8e0" stroke="#bfe4fb" stroke-width="1.2"/>`,
  Thunder:`<path d="M12 1 L14.4 7 L21 5 L17.6 11 L23 12 L17.6 13 L21 19 L14.4 17 L12 23 L9.6 17 L3 19 L6.4 13 L1 12 L6.4 11 L3 5 L9.6 7Z" fill="#f0b53c" stroke="#ffe39b" stroke-width="0.8"/>`,
  Rainbow:`<g stroke="#fff" stroke-width="0.6"><circle cx="12" cy="5.5" r="4" fill="#e0584a"/><circle cx="18.5" cy="9.5" r="4" fill="#e6a23c"/><circle cx="16" cy="17" r="4" fill="#e6c24a"/><circle cx="8" cy="17" r="4" fill="#5cb85c"/><circle cx="5.5" cy="9.5" r="4" fill="#6a8ee0"/><circle cx="12" cy="12" r="3" fill="#f4eedd"/></g>`,
  Soul:`<path d="M12 21 C2 13 5 4 12 8 C19 4 22 13 12 21Z" fill="#e87aa8" stroke="#f7c3da" stroke-width="1.2"/>`,
  Marsh:`<circle cx="12" cy="12" r="9" fill="#e8b94a" stroke="#f7e0a0" stroke-width="1.3"/><circle cx="12" cy="12" r="3.4" fill="#a87f1e"/>`,
  Volcano:`<path d="M12 2 C9 7 6 8 6 13 a6 6 0 0 0 12 0 C18 9 15 8 12 2Z" fill="#e15a3a" stroke="#f6b29a" stroke-width="1.1"/><path d="M12 9 C10.5 12 10 13 10 14.5 a2 2 0 0 0 4 0 C14 13 13.2 12 12 9Z" fill="#f0c265"/>`,
  Earth:`<path d="M12 2 C5 8 4 14 4 16 a8 8 0 0 0 16 0 C20 14 19 8 12 2Z" fill="#5cad5c" stroke="#bfe6bf" stroke-width="1.2"/><path d="M12 6 L12 19 M12 11 L8.5 8 M12 13 L15.5 10" stroke="#2f6b2f" stroke-width="1.1" fill="none"/>`,
};
const TYPE_COLOR = {normal:"#9aa0a8",fire:"#ff9d55",water:"#4d90d5",electric:"#e8c531",grass:"#63bc5a",
  ice:"#73cec0",fighting:"#ce4266",poison:"#ab6ac8",ground:"#d8794a",flying:"#8fa8dd",psychic:"#f97176",
  bug:"#90c12f",rock:"#c5b787",ghost:"#5a6fb0",dragon:"#1f73c4",dark:"#5d5566",steel:"#5a8ea1",fairy:"#ec8fe6"};
const SPRITE = id => `/web_dashboard/assets/pokemon/${id}.png`;
function hpColor(f){ return f>0.5?'var(--hp-hi)':f>0.2?'var(--hp-mid)':'var(--hp-lo)'; }
function el(id){ return document.getElementById(id); }
function fmtTime(s){
  if(s==null) return '';
  s=Math.floor(s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h>0 ? `${h}h ${m}m` : `${m}m`;
}
function shortPlace(p){
  if(!p) return '—';
  return String(p)
    .replace(/\bPok[eé]mon\b/gi,'PkMn')
    .replace(/\bDepartment Store\b/gi,'Dept')
    .replace(/\bRocket Hideout\b/gi,'Hideout')
    .replace(/\bUnderground Path\b/gi,'UG Path')
    .replace(/\bGame Corner\b/gi,'Corner')
    .replace(/\bCity\b/g,'').replace(/\bTown\b/g,'').replace(/\bRoute\b/g,'R')
    .replace(/\s+/g,' ').trim() || p;
}
function shortName(nm){
  if(!nm) return '?';
  nm = String(nm);
  // Sidebar: keep short species readable; trim long ones.
  if(nm.length <= 9) return nm;
  return nm.slice(0,8)+'…';
}

function render(d){
  const alive = !!d.running || ((d.party||[]).length > 0);
  el('hud').classList.toggle('on', alive);

  const stt = (d.now_state||'EXPLORING').toUpperCase();
  const sEl = el('state');
  const label = stt.charAt(0)+stt.slice(1).toLowerCase();
  sEl.title = label;
  sEl.className = 'pip ' + ({BATTLE:'battle',HEALING:'healing',SHOPPING:'shopping'}[stt]||'');

  el('place').textContent = shortPlace(d.place);
  el('place').title = d.place || '';
  const t = fmtTime(d.playthrough_s);
  el('timer').textContent = t;
  el('timer').title = t ? `playthrough ${t}` : '';

  // Prefer objective; if missing, fall back to want (still one brass line).
  const obj = d.objective || (d.want ? `“${d.want}”` : '');
  el('obj').textContent = obj;
  el('obj').style.display = obj ? '' : 'none';
  el('obj').title = obj;
  el('want').textContent = '';

  const g = d.goals || {};
  el('gShort').textContent = g.short || '';
  el('gMed').textContent = g.medium || '';
  el('gLong').textContent = g.long || '';
  el('goals').style.display = g.short ? '' : 'none';
  el('gShort').title = [g.short, g.medium, g.long].filter(Boolean).join(' · ');

  const n = d.badge_count||0;
  el('badges').innerHTML = BADGES.map((b,i)=>
    `<div class="badge ${i<n?'lit':''}" title="${b}${i<n?' — earned':''}"><svg viewBox="0 0 24 24">${BADGE_SVG[b]}</svg></div>`
  ).join('') + `<div class="bcount">${n}<span>/8</span></div>`;

  const party = d.party||[];
  el('party').innerHTML = party.length ? party.map(m=>{
    const hp = m.hp!=null?m.hp:0, mx = m.maxhp||1, f = Math.max(0, Math.min(1, hp/mx));
    const fainted = hp<=0, nm = m.species||'?', id = m.species_id;
    const t0 = (m.types||[])[0], t1 = (m.types||[])[1];
    const rail = t0
      ? `<span class="rail" style="background:${t1
          ? `linear-gradient(${TYPE_COLOR[t0]||'#777'},${TYPE_COLOR[t1]||'#777'})`
          : (TYPE_COLOR[t0]||'#777')}"></span>`
      : '';
    const phColor = TYPE_COLOR[t0] || '#d4bea0';
    const letter = (nm[0]||'?').toUpperCase();
    const art = id
      ? `<img class="sprite" src="${SPRITE(id)}" alt="${nm}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="ph" style="display:none;background:${phColor}">${letter}</div>`
      : `<div class="ph" style="background:${phColor}">${letter}</div>`;
    const tip = `${nm} · L${m.level||'?'} · ${hp}/${mx}${fainted?' · fainted':''}${(m.types||[]).length?' · '+(m.types||[]).join('/'):''}`;
    return `<div class="mon ${fainted?'fainted':''} ${m.active?'active':''}" title="${tip}">
      ${rail}${art}
      <div class="nm">${shortName(nm)}</div>
      <div class="meta"><span class="lv">L${m.level||'?'}</span>${m.active?'<span class="onfield">out</span>':''}</div>
      <div class="bar"><div class="fill" style="width:${(f*100).toFixed(0)}%;background:${hpColor(f)}"></div></div>
    </div>`;
  }).join('') : `<div class="empty">…</div>`;
}

async function poll(){
  try{ const r = await fetch('/pokemon_hud.json',{cache:'no-store'}); if(r.ok) render(await r.json()); }
  catch(e){}
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>

<!DOCTYPE html>
<!-- Kira's Pokémon STREAM HUD (OBS browser source) — SHANGRI-LA EDITION (2026-07-29).
     Ink + brass, matched to the web app's design language (KiraDashboard): midnight-ink cards,
     hairline brass borders, serif brand line, letter-spaced small caps, tabular numerals. Calm,
     refined, readable in 3 seconds — no neon, no glow-soup.
     Same data contract as before: re-skins /pokemon_hud.json (health snapshot). Real Gen-3 sprites
     (assets/pokemon/<species_id>.png) + real Kanto badge icons (inline SVG, lit/dim) + per-mon cards
     + playthrough timer, now-state, objective, want, 3-tier goals. Transparent bg; 1920x1080,
     pins bottom-left. NO token/runtime counters, NO reasoning transcript — that's Jonny's cockpit.
     VISIBILITY (the mid-run vanish, 2026-07-29): shown when running OR party data exists — the
     server's `running` used to read false for script-launched (non-dashboard) supervisors. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kira · Pokémon HUD</title>
<style>
  :root{
    /* Shangri-La — ink + brass (web app globals.css, night) */
    --ink:#0a090b;
    --card:rgba(10,9,11,.84); --card2:rgba(255,255,255,.03);
    --hairline:rgba(212,190,160,.16); --hairline-soft:rgba(212,190,160,.09);
    --brass:#d4bea0; --brass-bg:rgba(212,190,160,.12); --brass-dim:rgba(212,190,160,.45);
    --cream:#efe7ee; --muted:rgba(222,212,224,.58); --subtle:rgba(222,212,224,.36);
    --rose:#cf8fa6; --sage:#8fbf8f; --amber:#d9b56a;
    --hp-hi:#8fbf8f; --hp-mid:#d9b56a; --hp-lo:#cf7a6a;
  }
  html,body{margin:0;background:transparent;overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  #hud{position:fixed;left:28px;bottom:28px;width:372px;opacity:0;transition:opacity .8s ease;
    color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.5);}
  #hud.on{opacity:1;}
  .panel{background:var(--card);border:1px solid var(--hairline);border-radius:12px;
    backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35);}

  /* ── header ── */
  .head{padding:14px 16px 13px;margin-bottom:8px;}
  .row1{display:flex;align-items:center;gap:9px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);
    box-shadow:0 0 8px rgba(212,190,160,.55);flex:none;}
  .brand{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.14em;
    font-size:13.5px;text-transform:uppercase;color:var(--cream);}
  .state{margin-left:auto;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;background:var(--brass-bg);color:var(--brass);
    border:1px solid var(--hairline);white-space:nowrap;}
  .state.battle{background:rgba(207,143,166,.12);color:var(--rose);border-color:rgba(207,143,166,.28);}
  .state.healing{background:rgba(143,191,143,.10);color:var(--sage);border-color:rgba(143,191,143,.26);}
  .state.shopping{background:rgba(217,181,106,.10);color:var(--amber);border-color:rgba(217,181,106,.26);}
  .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted);}
  .meta .place{color:var(--cream);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .meta .sep{opacity:.35;}
  .meta #timer{font-variant-numeric:tabular-nums;color:var(--subtle);}
  .obj{margin-top:9px;font-size:11px;color:var(--brass);display:flex;align-items:center;gap:6px;
    font-weight:400;line-height:1.35;}
  .obj svg{flex:none;}
  .want{margin-top:5px;font-size:10.5px;font-style:italic;color:var(--muted);
    font-family:Georgia,'Times New Roman',serif;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* ── 3-tier goal (short / medium / long) — "stuck vs strategizing" at a glance ── */
  .goals{margin-top:9px;padding-top:8px;border-top:1px solid var(--hairline-soft);
    display:flex;flex-direction:column;gap:3px;}
  .goal{font-size:10.5px;color:var(--cream);display:flex;gap:7px;align-items:baseline;line-height:1.3;}
  .goal b{flex:none;font-size:8px;font-weight:600;letter-spacing:.12em;width:34px;
    color:var(--brass);text-transform:uppercase;}
  .goal.med b{color:var(--brass-dim);} .goal.long b{color:var(--subtle);}
  .goal span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
  .goal.now span{color:var(--cream);}

  /* ── badges ── */
  .badges{display:flex;gap:4px;padding:11px 13px 9px;margin-bottom:8px;align-items:center;}
  .badge{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .badge svg{width:25px;height:25px;filter:grayscale(1) brightness(.42) opacity(.5);transition:filter .6s ease;}
  .badge.lit svg{filter:none;}
  .badge .lbl{font-size:7.5px;letter-spacing:.08em;color:var(--subtle);text-transform:uppercase;}
  .badge.lit .lbl{color:var(--brass);}
  .bcount{display:flex;align-items:baseline;gap:2px;margin-left:auto;font-size:12px;font-weight:600;
    color:var(--brass);font-variant-numeric:tabular-nums;}
  .bcount span{color:var(--subtle);font-size:10px;font-weight:400;}

  /* ── party cards ── */
  .party{padding:11px 13px 12px;}
  .ttl{display:flex;align-items:center;font-size:9px;letter-spacing:.2em;color:var(--subtle);
    text-transform:uppercase;margin-bottom:9px;font-weight:500;}
  .mon{display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:9px;
    background:var(--card2);border:1px solid var(--hairline-soft);margin-bottom:6px;}
  .mon:last-child{margin-bottom:0;}
  .mon .sprite{width:52px;height:52px;flex:none;image-rendering:pixelated;
    image-rendering:crisp-edges;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));}
  .mon .ph{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:var(--ink);border-radius:9px;}
  .mon .info{flex:1;min-width:0;}
  .mon .top{display:flex;align-items:baseline;gap:7px;}
  .mon .nm{font-weight:600;font-size:13.5px;color:var(--cream);text-transform:capitalize;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mon .lv{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--brass);flex:none;
    font-variant-numeric:tabular-nums;}
  .types{display:flex;gap:4px;margin:4px 0 5px;}
  .type{font-size:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 6px;border-radius:4px;color:rgba(255,255,255,.92);
    text-shadow:0 1px 1px rgba(0,0,0,.4);opacity:.88;}
  .hpwrap{display:flex;align-items:center;gap:7px;}
  .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
  .fill{height:100%;border-radius:3px;transition:width .5s ease,background .5s ease;}
  .hpnum{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;
    min-width:46px;text-align:right;}
  .mon.fainted{opacity:.4;}
  /* the mon ACTUALLY fighting right now (mid-battle) — brass edge + ON FIELD tag, so a faint or a
     mid-battle switch can never make the top card read as "who's out" (2026-07-30 fix) */
  .mon.active{border-color:rgba(212,190,160,.55);box-shadow:0 0 0 1px rgba(212,190,160,.25);}
  .onfield{font-size:7.5px;font-weight:700;letter-spacing:.14em;color:#0d0c0e;background:var(--brass);
    border-radius:3px;padding:1.5px 5px;margin-left:6px;flex:none;text-transform:uppercase;}
  .empty{color:var(--muted);font-size:11.5px;font-style:italic;padding:4px 2px;
    font-family:Georgia,'Times New Roman',serif;}
</style>
</head>
<body>
<div id="hud">
  <div class="panel head">
    <div class="row1"><span class="dot"></span><span class="brand">Kira · the climb</span>
      <span class="state" id="state">Exploring</span></div>
    <div class="meta"><span class="place" id="place">—</span>
      <span class="sep" id="sepT">·</span><span id="timer"></span></div>
    <div class="obj" id="objWrap"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"
      stroke="#d4bea0" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="#d4bea0"/></svg>
      <span id="obj"></span></div>
    <div class="want" id="want"></div>
    <div class="goals" id="goals">
      <div class="goal now"><b>Now</b><span id="gShort"></span></div>
      <div class="goal med"><b>Next</b><span id="gMed"></span></div>
      <div class="goal long"><b>Goal</b><span id="gLong"></span></div>
    </div>
  </div>
  <div class="panel badges" id="badges"></div>
  <div class="panel party"><div class="ttl">the team</div><div id="party"></div></div>
</div>
<script>
const BADGES = ["Boulder","Cascade","Thunder","Rainbow","Soul","Marsh","Volcano","Earth"];
// Real Kanto badge icons as inline SVG (their actual shapes + official colours), lit when earned.
const BADGE_SVG = {
  Boulder:`<polygon points="12,2 20,7 20,17 12,22 4,17 4,7" fill="#9b9486" stroke="#cfc7b6" stroke-width="1.2"/>`,
  Cascade:`<path d="M12 2 C12 2 4 12 4 16 a8 8 0 0 0 16 0 C20 12 12 2 12 2Z" fill="#4fa8e0" stroke="#bfe4fb" stroke-width="1.2"/>`,
  Thunder:`<path d="M12 1 L14.4 7 L21 5 L17.6 11 L23 12 L17.6 13 L21 19 L14.4 17 L12 23 L9.6 17 L3 19 L6.4 13 L1 12 L6.4 11 L3 5 L9.6 7Z" fill="#f0b53c" stroke="#ffe39b" stroke-width="0.8"/>`,
  Rainbow:`<g stroke="#fff" stroke-width="0.6"><circle cx="12" cy="5.5" r="4" fill="#e0584a"/><circle cx="18.5" cy="9.5" r="4" fill="#e6a23c"/><circle cx="16" cy="17" r="4" fill="#e6c24a"/><circle cx="8" cy="17" r="4" fill="#5cb85c"/><circle cx="5.5" cy="9.5" r="4" fill="#6a8ee0"/><circle cx="12" cy="12" r="3" fill="#f4eedd"/></g>`,
  Soul:`<path d="M12 21 C2 13 5 4 12 8 C19 4 22 13 12 21Z" fill="#e87aa8" stroke="#f7c3da" stroke-width="1.2"/>`,
  Marsh:`<circle cx="12" cy="12" r="9" fill="#e8b94a" stroke="#f7e0a0" stroke-width="1.3"/><circle cx="12" cy="12" r="3.4" fill="#a87f1e"/>`,
  Volcano:`<path d="M12 2 C9 7 6 8 6 13 a6 6 0 0 0 12 0 C18 9 15 8 12 2Z" fill="#e15a3a" stroke="#f6b29a" stroke-width="1.1"/><path d="M12 9 C10.5 12 10 13 10 14.5 a2 2 0 0 0 4 0 C14 13 13.2 12 12 9Z" fill="#f0c265"/>`,
  Earth:`<path d="M12 2 C5 8 4 14 4 16 a8 8 0 0 0 16 0 C20 14 19 8 12 2Z" fill="#5cad5c" stroke="#bfe6bf" stroke-width="1.2"/><path d="M12 6 L12 19 M12 11 L8.5 8 M12 13 L15.5 10" stroke="#2f6b2f" stroke-width="1.1" fill="none"/>`,
};
const TYPE_COLOR = {normal:"#9aa0a8",fire:"#ff9d55",water:"#4d90d5",electric:"#e8c531",grass:"#63bc5a",
  ice:"#73cec0",fighting:"#ce4266",poison:"#ab6ac8",ground:"#d8794a",flying:"#8fa8dd",psychic:"#f97176",
  bug:"#90c12f",rock:"#c5b787",ghost:"#5a6fb0",dragon:"#1f73c4",dark:"#5d5566",steel:"#5a8ea1",fairy:"#ec8fe6"};
const SPRITE = id => `/web_dashboard/assets/pokemon/${id}.png`;
function hpColor(f){ return f>0.5?'var(--hp-hi)':f>0.2?'var(--hp-mid)':'var(--hp-lo)'; }
function el(id){ return document.getElementById(id); }
function fmtTime(s){ if(s==null) return ''; s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h>0 ? `${h}h ${m}m` : `${m}m`; }

function render(d){
  // Visible when running OR game data exists — `running` reads false for runs the dashboard
  // didn't spawn itself (marathon script's supervisor), which vanished the HUD mid-stream.
  const alive = !!d.running || ((d.party||[]).length > 0);
  el('hud').classList.toggle('on', alive);
  // now-state pill
  const stt = (d.now_state||'EXPLORING').toUpperCase();
  const sEl = el('state'); sEl.textContent = stt.charAt(0)+stt.slice(1).toLowerCase();
  sEl.className = 'state ' + ({BATTLE:'battle',HEALING:'healing',SHOPPING:'shopping'}[stt]||'');
  el('place').textContent = d.place || '—';
  const t = fmtTime(d.playthrough_s); el('timer').textContent = t; el('sepT').style.display = t?'':'none';
  el('obj').textContent = d.objective || '';
  el('objWrap').style.display = d.objective ? '' : 'none';
  el('want').textContent = d.want ? `“${d.want}”` : '';
  el('want').style.display = d.want ? '' : 'none';
  // 3-tier goal (short/medium/long): what she's doing now, the obstacle she's prepping for, the milestone
  const g = d.goals || {};
  el('gShort').textContent = g.short || '';
  el('gMed').textContent   = g.medium || '';
  el('gLong').textContent  = g.long || '';
  el('goals').style.display = (g.short || g.medium || g.long) ? '' : 'none';

  // badge row — lit by count (canonical order), real badge graphics
  const n = d.badge_count||0;
  el('badges').innerHTML = BADGES.map((b,i)=>
    `<div class="badge ${i<n?'lit':''}"><svg viewBox="0 0 24 24">${BADGE_SVG[b]}</svg><div class="lbl">${b}</div></div>`
  ).join('') + `<div class="bcount">${n}<span>/8</span></div>`;

  // party cards — real sprite + name + level + type badges + HP bar
  const party = d.party||[];
  el('party').innerHTML = party.length ? party.map(m=>{
    const hp = m.hp!=null?m.hp:0, mx = m.maxhp||1, f = Math.max(0, Math.min(1, hp/mx));
    const fainted = hp<=0, nm = m.species||'?', id = m.species_id;
    const types = (m.types||[]).map(t=>
      `<span class="type" style="background:${TYPE_COLOR[t]||'#777'}">${t}</span>`).join('');
    const phColor = TYPE_COLOR[(m.types||[])[0]] || '#d4bea0';
    const letter = (nm[0]||'?').toUpperCase();
    // sprite with a clean fallback: on load-error hide the img and reveal the letter placeholder.
    const art = id
      ? `<img class="sprite" src="${SPRITE(id)}" alt="${nm}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="ph" style="display:none;background:${phColor}">${letter}</div>`
      : `<div class="ph" style="background:${phColor}">${letter}</div>`;
    return `<div class="mon ${fainted?'fainted':''} ${m.active?'active':''}">
      ${art}
      <div class="info">
        <div class="top"><span class="nm">${nm}</span>${m.active?'<span class="onfield">on field</span>':''}<span class="lv">Lv ${m.level||'?'}</span></div>
        <div class="types">${types}</div>
        <div class="hpwrap">
          <div class="bar"><div class="fill" style="width:${(f*100).toFixed(0)}%;background:${hpColor(f)}"></div></div>
          <span class="hpnum">${hp}/${mx}</span>
        </div>
      </div></div>`;
  }).join('') : `<div class="empty">just getting started…</div>`;
}

async function poll(){
  try{ const r = await fetch('/pokemon_hud.json',{cache:'no-store'}); if(r.ok) render(await r.json()); }
  catch(e){ /* overlay stays as-is on a blip */ }
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
